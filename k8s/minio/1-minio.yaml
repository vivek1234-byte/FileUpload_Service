# MODE 3 (challenge): MinIO object storage.
# MinIO runs as its own pod with its own disk. The app keeps nothing locally, it talks to
# MinIO over the network, so the app pod can be deleted or scaled without losing data.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: vortex
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: vortex
  labels:
    app: minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          # The official minio/minio images are no longer published; this is the
          # community-maintained build of the same MinIO server (same commands and settings).
          image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000   # S3 API, used by the app
            - containerPort: 9001   # web console
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: vortex-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vortex-secret
                  key: MINIO_ROOT_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
# The app reaches MinIO at minio:9000. Only inside the cluster (ClusterIP).
# To see the console: kubectl -n vortex port-forward svc/minio 9001
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: vortex
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
    - name: console
      port: 9001
