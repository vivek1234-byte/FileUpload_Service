# Example only. Jenkins creates the real Secret from its own credentials, so no password is
# kept in Git. To deploy by hand: copy this to secret.yaml, change the values, and apply it.
# (secret.yaml is in .gitignore.)
apiVersion: v1
kind: Secret
metadata:
  name: vortex-secret
  namespace: vortex
type: Opaque
stringData:
  SECRET_KEY: change-me-to-a-long-random-string   # signs login tokens
  MINIO_ROOT_USER: vortex-admin                   # only used in MinIO mode
  MINIO_ROOT_PASSWORD: change-me-minio-password   # at least 8 characters
